name: Publish

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v1.3.0)'
        required: true

permissions:
  contents: read

jobs:
  resolve-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      tag: ${{ steps.release.outputs.tag }}

    steps:
      - name: Checkout selected release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve immutable release commit
        id: release
        env:
          TAG_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$TAG_NAME" =~ ^v[0-9] ]]; then
            echo "::error::Tag '$TAG_NAME' does not match the extension-release pattern ^v[0-9] -- refusing to run the VSIX publish workflow"
            exit 1
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"

  mcp-bundle:
    needs: [resolve-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.resolve-release.outputs.commit }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Test bundled MCP server and VSIX contents
        run: npm run test:mcp-bundle

  packaged-native-mcp:
    needs: [resolve-release]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.resolve-release.outputs.commit }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Test packaged native MCP integration (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:packaged-mcp

      - name: Test packaged native MCP integration (Windows)
        if: runner.os == 'Windows'
        run: npm run test:packaged-mcp

  publish:
    needs: [resolve-release, mcp-bundle, packaged-native-mcp]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.resolve-release.outputs.commit }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: xvfb-run -a npm test

      - name: Derive channel
        env:
          TAG: ${{ needs.resolve-release.outputs.tag }}
        run: |
          VERSION=${TAG#v}
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          if [ $((MINOR % 2)) -eq 0 ]; then
            CHANNEL=stable
          else
            CHANNEL=prerelease
          fi
          echo "CHANNEL=$CHANNEL" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG_NAME=$TAG" >> "$GITHUB_ENV"

      - name: Publish
        run: npm run "publish:$CHANNEL" -- --githubBranch "$RELEASE_COMMIT"
        env:
          RELEASE_COMMIT: ${{ needs.resolve-release.outputs.commit }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Extract release notes
        if: success()
        run: node scripts/extract-changelog.js "$VERSION" > release_notes.md

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.TAG_NAME }}
          body_path: release_notes.md
          prerelease: ${{ env.CHANNEL == 'prerelease' }}
